# ============================================================
# CareerMatch Backend - Test Profile
# ============================================================

spring.application.name=careermatch-backend-test

# ------------------------------------------------------------
# H2 In-Memory Database for Tests
# ------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ------------------------------------------------------------
# Flyway (disabled in tests - Hibernate creates schema)
# ------------------------------------------------------------
spring.flyway.enabled=false

# ------------------------------------------------------------
# JWT
# ------------------------------------------------------------
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000
app.jwt.issuer=careermatch-test
app.jwt.audience=careermatch-test
app.jwt.header=Authorization
app.jwt.prefix=Bearer 

# ------------------------------------------------------------
# CORS
# ------------------------------------------------------------
app.cors.allowed-origins=http://localhost:4200
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# ------------------------------------------------------------
# External APIs (disabled in tests)
# ------------------------------------------------------------
app.adzuna.base-url=https://api.adzuna.com/v1/api
app.adzuna.app-id=test-id
app.adzuna.app-key=test-key
app.adzuna.country=gb
app.adzuna.results-per-page=20
app.adzuna.timeout=10000

app.groq.base-url=https://api.groq.com/openai/v1
app.groq.api-key=test-key
app.groq.chat-model=openai/gpt-oss-20b
app.groq.temperature=0.2

app.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/
app.gemini.api-key=test-key
app.gemini.embedding-model=gemini-embedding-001
app.gemini.timeout=60000

# ------------------------------------------------------------
# Cache
# ------------------------------------------------------------
app.cache.jobs-ttl=60
app.cache.skills-ttl=60
app.cache.profiles-ttl=60
app.cache.max-size=100

# ------------------------------------------------------------
# Scoring
# ------------------------------------------------------------
app.scoring.required-weight=0.6
app.scoring.preferred-weight=0.2
app.scoring.semantic-weight=0.2

# ------------------------------------------------------------
# Frontend URL
# ------------------------------------------------------------
app.frontend.url=http://localhost:4200

# ------------------------------------------------------------
# File Upload
# ------------------------------------------------------------
app.file.upload-dir=./target/test-uploads/cvs
app.file.allowed-types=application/pdf
app.file.max-size=5242880
app.file.allowed-extensions=pdf

# ------------------------------------------------------------
# Mail (disabled in tests)
# ------------------------------------------------------------
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging.level.root=WARN
logging.level.com.example.backend=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ------------------------------------------------------------
# Actuator
# ------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ------------------------------------------------------------
# OpenAPI (disabled in tests)
# ------------------------------------------------------------
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false